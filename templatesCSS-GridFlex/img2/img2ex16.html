<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            display: grid;
            grid-template-areas:
            "c1 c1 c2 c3"
            "c4 c5 c6 c3"
            "c7 c8 c6 c9"
            "c10 c10 c11 c12";
            grid-template-columns: 1fr 1fr 1fr 1fr;
            grid-template-rows: 170px 170px 170px 170px;
            gap: 4px;
        }
        .cx1{
            grid-area: c1;
            border: 1px solid black;
            background-color: violet;
        }
        .cx2{
            grid-area: c2;
            border: 1px solid black;
            background-color: violet;
        }
        .cx3{
            grid-area: c3;
            border: 1px solid black;
            background-color: violet;
        }
        .cx4{
            grid-area: c4;
            border: 1px solid black;
            background-color: violet;
        }
        .cx5{
            grid-area: c5;
            border: 1px solid black;
            background-color: violet;
        }
        .cx6{
            grid-area: c6;
            border: 1px solid black;
            background-color: violet;
        }
        .cx7{
            grid-area: c7;
            border: 1px solid black;
            background-color: violet;
        }
        .cx8{
            grid-area: c8;
            border: 1px solid black;
            background-color: violet;
        }
        .cx9{
            grid-area: c9;
            border: 1px solid black;
            background-color: violet;
        }
        .cx10{
            grid-area: c10;
            border: 1px solid black;
            background-color: violet;
        }
        .cx11{
            grid-area: c11;
            border: 1px solid black;
            background-color: violet;
        }
        .cx12{
            grid-area: c12;
            border: 1px solid black;
            background-color: violet;
        }
    </style>
</head>
<body>
    <div class="cx1"></div>
    <div class="cx2"></div>
    <div class="cx3"></div>
    <div class="cx4"></div>
    <div class="cx5"></div>
    <div class="cx6"></div>
    <div class="cx7"></div>
    <div class="cx8"></div>
    <div class="cx9"></div>
    <div class="cx10"></div>
    <div class="cx11"></div>
    <div class="cx12"></div>
</body>
</html>
