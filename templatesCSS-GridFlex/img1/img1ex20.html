<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            display: grid;
            grid-template-areas:
            "c1 c1 c2 c2"
            "c1 c1 c3 c4"
            "c1 c1 c5 c5"
            "c1 c1 c6 c7";
            grid-template-columns: 1fr 1fr 1fr 1fr;
            grid-template-rows: 175px 175px 175px 175px;
        }
        .cx1{
            grid-area: c1;
            border: 1px solid black;
            background-color: antiquewhite;
        }
        .cx2{
            grid-area: c2;
            border: 1px solid black;
            background-color: aquamarine;
        }
        .cx3{
            grid-area: c3;
            border: 1px solid black;
            background-color: whitesmoke;
        }
        .cx4{
            grid-area: c4;
            border: 1px solid black;
            background-color: violet;
        }
        .cx5{
            grid-area: c5;
            border: 1px solid black;
            background-color: purple;
        }
        .cx6{
            grid-area: c6;
            border: 1px solid black;
            background-color: cornsilk;
        }
        .cx7{
            grid-area: c7;
            border: 1px solid black;
            background-color: gray;
        }
    </style>
</head>
<body>
    <div class="cx1"></div>
    <div class="cx2"></div>
    <div class="cx3"></div>
    <div class="cx4"></div>
    <div class="cx5"></div>
    <div class="cx6"></div>
    <div class="cx7"></div>
</body>
</html>
