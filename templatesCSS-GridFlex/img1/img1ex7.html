<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            display: grid;
            grid-template-areas: 
            "c1 c1 c1 c1 c1 c1"
            "c2 c3 c4 c4 c5 c5"
            "c6 c6 c4 c4 c5 c5";
            grid-template-columns: 1fr 1fr 1fr 1fr 1fr 1fr;
            grid-template-rows: 400px 200px 220px;
        }

        .cx1{
            grid-area: c1;
            border: 1px solid black;
            background-color: aqua;
        }

        .cx2{
            grid-area: c2;
            border: 1px solid black;
            background-color: blueviolet;
        }
        
        .cx3{
            grid-area: c3;
            border: 1px solid black;
            background-color: darkorchid;
        }

        .cx4{
            grid-area: c4;
            border: 1px solid black;
            background-color: violet;
        }
        
        .cx5{
            grid-area: c5;
            border: 1px solid black;
            background-color: darkblue;
        }

        .cx6{
            grid-area: c6;
            border: 1px solid black;
            background-color: darkmagenta;
        }
    </style>
</head>
<body>
    <div class="cx1"></div>
    <div class="cx2"></div>
    <div class="cx3"></div>
    <div class="cx4"></div>
    <div class="cx5"></div>
    <div class="cx6"></div>
</body>
</html>
