<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            display: grid;
            grid-template-areas:
            "c1 c1 c2"
            "c1 c1 c3"
            "c4 c5 c6";
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 215px 215px 215px;
        }
        .cx1{
            grid-area: c1;
            border: 1px solid black;
            background-color: blueviolet;
        }

        .cx2{
            grid-area: c2;
            border: 1px solid black;
            background-color: coral;
        }

        .cx3{
            grid-area: c3;
            border: 1px solid black;
            background-color: cadetblue;
        }

        .cx4{
            grid-area: c4;
            border: 1px solid black;
            background-color: teal;
        }

        .cx5{
            grid-area: c5;
            border: 1px solid black;
            background-color: aquamarine;
        }

        .cx6{
            grid-area: c6;
            border: 1px solid black;
            background-color: darkcyan;
        }
    </style>
</head>
<body>
    <caixa class="cx1"></caixa>
    <caixa class="cx2"></caixa>
    <caixa class="cx3"></caixa>
    <caixa class="cx4"></caixa>
    <caixa class="cx5"></caixa>
    <caixa class="cx6"></caixa>
</body>
</html>
