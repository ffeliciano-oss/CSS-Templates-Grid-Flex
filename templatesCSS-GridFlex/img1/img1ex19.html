<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            display: grid;
            grid-template-areas:
            "c1 c1 c1 c1"
            "c1 c1 c1 c1"
            "c2 c2 c2 c2"
            "c2 c2 c2 c2"
            "c3 c4 c5 c6"
            "c3 c7 c5 c8";
            grid-template-columns: 1fr 1fr 1fr 1fr;
            grid-template-rows: 108px 108px 108px 108px 108px 108px;
        }
        .cx1{
            grid-area: c1;
            border: 1px solid black;
            background-color: darkorange;
        }
        .cx2{
            grid-area: c2;
            border: 1px solid black;
            background-color: violet;
        }
        .cx3{
            grid-area: c3;
            border: 1px solid black;
            background-color: limegreen;
        }
        .cx4{
            grid-area: c4;
            border: 1px solid black;
            background-color: crimson;
        }
        .cx5{
            grid-area: c5;
            border: 1px solid black;
            background-color: floralwhite;
        }
        .cx6{
            grid-area: c6;
            border: 1px solid black;
            background-color: turquoise;
        }
        .cx7{
            grid-area: c7;
            border: 1px solid black;
            background-color: deepskyblue;
        }
        .cx8{
            grid-area: c8;
            border: 1px solid black;
            background-color: cornsilk;
        }
    </style>
</head>
<body>
    <div class="cx1"></div>
    <div class="cx2"></div>
    <div class="cx3"></div>
    <div class="cx4"></div>
    <div class="cx5"></div>
    <div class="cx6"></div>
    <div class="cx7"></div>
    <div class="cx8"></div>
</body>
</html>
